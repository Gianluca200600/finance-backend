services:
  postgres:
    image: postgres:16
    container_name: finance_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: giniFinDB
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - finance_pg_data:/var/lib/postgresql/data

volumes:
  finance_pg_data: